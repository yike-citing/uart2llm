name: Build and release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows single EXE and device tools
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Validate source and build embedded Web
        run: |
          python -B scripts/check-source.py
          if ($LASTEXITCODE) { throw 'Source check failed' }
          ./scripts/build-ui.ps1
      - name: Go checks
        run: |
          go vet ./...
          if ($LASTEXITCODE) { throw 'Go vet failed' }
          go test ./...
          if ($LASTEXITCODE) { throw 'Go tests failed' }
      - name: Python and scheduler regression checks
        run: |
          python -m pip install esp-idf-nvs-partition-gen==0.3.0
          if ($LASTEXITCODE) { throw 'Test dependencies failed' }
          python -m unittest discover -s scripts -p '*test*.py'
          if ($LASTEXITCODE) { throw 'Python tests failed' }
          node --test integrations/deepseek-harness/scheduler.test.mjs
          if ($LASTEXITCODE) { throw 'Scheduler tests failed' }
      - name: Build single Agent EXE
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = '0.2.0-dev'
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v\d+\.\d+\.\d+([-.][A-Za-z0-9.]+)?$') { throw 'Invalid release tag' }
            $version = $env:REF_NAME.Substring(1)
          }
          ./scripts/build-agent.ps1 -Version $version
          python scripts/release-smoke.py --exe dist/release/uart2llm-agent-windows-x64.exe --version $version
          if ($LASTEXITCODE) { throw 'Single EXE lifecycle smoke failed' }
      - name: Build optional offline device tools
        run: |
          ./scripts/build-offline-tools.ps1 -Python python
          $stage = '.tools/device-tools-release'
          New-Item -ItemType Directory -Force "$stage/tools", "$stage/source/packaging/sources", "$stage/source/scripts" | Out-Null
          Copy-Item dist/tools/*.exe "$stage/tools"
          Copy-Item packaging/licenses "$stage/licenses" -Recurse
          Copy-Item packaging/sources/esptool-5.4.0.tar.gz "$stage/source/packaging/sources"
          Copy-Item packaging/esptool_entry.py,packaging/offline-tools-requirements.txt "$stage/source/packaging"
          Copy-Item scripts/build-offline-tools.ps1,scripts/provision-device.py "$stage/source/scripts"
          Copy-Item docs/RELEASE.md "$stage/README.md"
          Copy-Item LICENSE,THIRD_PARTY.md $stage
          & "$stage/tools/provision-device.exe" --help | Out-Null
          if ($LASTEXITCODE) { throw 'Provisioning tool startup failed' }
          & "$stage/tools/esptool.exe" version
          if ($LASTEXITCODE) { throw 'Flashing tool startup failed' }
          Compress-Archive -Path "$stage/*" -DestinationPath dist/release/uart2llm-device-tools-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  firmware:
    name: ESP32-S3 (${{ matrix.transport }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: espressif/idf:v6.0.1
    strategy:
      fail-fast: false
      matrix:
        transport: [uart, usb-validation]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build firmware
        shell: bash
        env:
          TRANSPORT: ${{ matrix.transport }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          defaults=sdkconfig.defaults
          if [ "$TRANSPORT" = usb-validation ]; then defaults=sdkconfig.usb-validation; fi
          version=0.2.0-dev
          if [ "$REF_TYPE" = tag ]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]]
            version="${REF_NAME#v}"
          fi
          idf.py -C firmware -B "$PWD/firmware/build" -D "PROJECT_VER=$version" -D "SDKCONFIG=$PWD/firmware/build/sdkconfig" -D "SDKCONFIG_DEFAULTS=$PWD/firmware/$defaults" build
          python scripts/package-firmware.py --transport "$TRANSPORT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-${{ matrix.transport }}
          path: dist/release/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, firmware]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Check assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]]
          for name in uart2llm-agent-windows-x64.exe uart2llm-device-tools-windows-x64.zip uart2llm-firmware-uart.zip uart2llm-firmware-usb-validation.zip LICENSES.txt README.md; do
            test -s "release-assets/$name"
          done
          python3 scripts/package-offline.py --assets release-assets
          (cd release-assets && sha256sum *.exe *.zip *.txt *.md > SHA256SUMS)
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "uart2llm $RELEASE_TAG · Agent + ESP32 完整离线包" --notes-file docs/RELEASE.md
          gh release upload "$RELEASE_TAG" release-assets/*
          gh release edit "$RELEASE_TAG" --draft=false
